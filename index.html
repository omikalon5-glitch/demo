
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 15px;
}

.player-container {
    width: 100%;
    max-width: 850px;
}

.player {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: linear-gradient(135deg,#222,#080808);
    border: 1px solid #333;
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
}

.play-button {
    width: 85px;
    height: 85px;
    background: #f00000;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    box-shadow: 0 0 30px rgba(255,0,0,.5);
    transition: .2s;
    animation: pulse 1.5s infinite;
}

.play-button:hover {
    transform: scale(1.12);
    background: #ff2222;
}

.play-icon {
    width: 0;
    height: 0;
    border-top: 17px solid transparent;
    border-bottom: 17px solid transparent;
    border-left: 27px solid white;
    margin-left: 7px;
}

@keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255,0,0,.6); }
    70% { box-shadow: 0 0 0 20px rgba(255,0,0,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,0,0,0); }
}

.loading {
    position: absolute;
    bottom: 18px;
    left: 20px;
    right: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: #ddd;
}

.loader {
    width: 15px;
    height: 15px;
    border: 2px solid #555;
    border-top-color: red;
    border-radius: 50%;
    animation: spin .7s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.player-controls {
    display: flex;
    justify-content: space-between;
    padding: 14px 5px;
    color: #aaa;
    font-size: 13px;
}

.title {
    margin-top: 15px;
    font-size: 17px;
    font-weight: bold;
}

.notice {
    color: #aaa;
    font-size: 13px;
    margin-top: 8px;
}

</style>
</head>

<body>

<div class="player-container">

    <div class="player">

        <div class="play-button" onclick="redirectNow()">
            <div class="play-icon"></div>
        </div>

        <div class="loading">
            <div class="loader"></div>
            <span>Preparing video, please wait...</span>
        </div>

    </div>

    <div class="player-controls">
        <span>▶ &nbsp; 00:00 / --:--</span>
        <span>⚙ &nbsp; ⛶</span>
    </div>


</div>

<script>

// CHANGE YOUR REDIRECT LINK HERE
const redirectURL = "https://tinyurl.com/29nabvch";

let redirected = false;

function redirectNow() {
    if (redirected) return;
    redirected = true;
    window.location.replace(redirectURL);
}

// Automatic redirect after 2 seconds
setTimeout(function() {
    redirectNow();
}, 2000);

</script>

</body>
</html>
